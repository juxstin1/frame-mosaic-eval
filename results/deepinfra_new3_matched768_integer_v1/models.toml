# Matched-768 sweep config. Adding a model or changing its answer format = edit this file, not the runner.
# Runner: --models <names> [--mode direct|thinking] [--answer-format integer|object]
# A model runs in a mode only if it has that mode's table (Opus 5.5 has no `direct`: it cannot turn thinking off).

[modes.direct]
system = "Respond with a single integer only. Do not explain or show working."
max_tokens = 32

[modes.thinking]
system = "Reason internally as needed. Return only a single integer as the final answer."
max_tokens = 4096

[formats.integer]
schema = { type = "integer" }

[formats.object]
schema = { type = "object", properties = { answer = { type = "integer" } }, required = ["answer"], additionalProperties = false }

# Protocol name written into every record = protocols[mode][format]
[protocols.direct]
integer = "matched768_integer_schema_v1"
object = "matched768_answer_object_v1"
[protocols.thinking]
integer = "matched768_thinking4096_v1"
object = "matched768_thinking4096_object_v1"

# ---- models: provider, id, default answer format, extra request fields per mode ----
[models.mistral]
provider = "deepinfra"
id = "mistralai/Mistral-Small-3.2-24B-Instruct-2506"
direct = {}

[models.scout]
provider = "deepinfra"
id = "meta-llama/Llama-4-Scout-17B-16E-Instruct"
direct = {}

[models.qwen30]
provider = "deepinfra"
id = "Qwen/Qwen3-VL-30B-A3B-Instruct"
direct = {}

[models.glmflash]
provider = "deepinfra"
id = "zai-org/GLM-5.3-Flash"
direct = { reasoning_effort = "none" }
thinking = { reasoning_effort = "high" }

[models.gemma26]
provider = "deepinfra"
id = "google/gemma-4-26B-A4B-it"
direct = { reasoning_effort = "none" }
thinking = { reasoning_effort = "high" }

[models.nemotron]
provider = "deepinfra"
id = "nvidia/NVIDIA-Nemotron-3.5-Super-VL"
direct = { reasoning_effort = "none" }
thinking = { reasoning_effort = "high" }

[models.qwen38]
provider = "deepinfra"
id = "Qwen/Qwen3.8-27B"
direct = { reasoning_effort = "none" }
thinking = { reasoning_effort = "high" }

[models.gemma]
provider = "local"
id = "gemma4-12b-qat-q4_0-matched768"
direct = { chat_template_kwargs = { enable_thinking = false } }

[models.haiku55]
provider = "anthropic"
id = "claude-haiku-5-5"
answer_format = "object"   # bare integer ran on in digits: results/claude_matched768_haiku_v1
direct = { thinking = { type = "disabled" } }
notes = ["temperature omitted (rejected by model)"]

[models.sonnet55]
provider = "anthropic"
id = "claude-sonnet-5-5"
answer_format = "object"
direct = { thinking = { type = "between_tools" } }
notes = ["temperature omitted (rejected by model)"]

[models.opus55]
provider = "anthropic"
id = "claude-opus-5-5"
answer_format = "object"
thinking = { output_config = { effort = "high" } }   # high effort also requested on DeepInfra; provider effort scales are not calibrated
notes = ["temperature omitted (rejected by model)", "thinking cannot be disabled; thinking mode only"]

# New DeepInfra direct-answer aliases are loaded by matched_768.py from this file.
# Existing aliases retain their frozen request settings until the full migration is installed.
